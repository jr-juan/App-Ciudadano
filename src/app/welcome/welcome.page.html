<ion-content class="welcome-screen" [class.is-leaving]="isLeaving">
  <div class="welcome-backdrop" aria-hidden="true"></div>
  <img class="welcome-image" src="assets/welcome-image.png" alt="Camión recolector de basura siguiendo una ruta" />
  <div class="welcome-card">
    <div class="logo-wrap">
      <div class="logo-circle">E</div>
    </div>
    <h1>EcoRuta Ciudadano</h1>
    <p>Te estamos llevando al mapa para que visualices el recorrido del vehículo en tiempo real.</p>
    <div class="welcome-progress" aria-hidden="true">
      <div class="welcome-progress-bar"></div>
    </div>
  </div>
</ion-content>
